# Perfil para un servidor publico detras de un proxy inverso.
# Arrancalo con: java -jar hack-deck-backend.jar --spring.profiles.active=cloud

server:
  # Sin esto, el proxy aparece como cliente y la exencion de clave por
  # loopback dejaria crear partidas a cualquiera.
  forward-headers-strategy: framework

hackdeck:
  security:
    allow-loopback-without-key: false
    jwt-secret: ${HACKDECK_JWT_SECRET}
    # Vacia = crear partidas queda abierto a cualquiera, que es lo previsto
    # en un despliegue publico. Ponla para volver al modo cerrado.
    instructor-key: ${HACKDECK_INSTRUCTOR_KEY:}
