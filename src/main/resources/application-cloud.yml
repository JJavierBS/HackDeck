# Perfil para un servidor publico detras de un proxy inverso.
# Arrancalo con: java -jar cyber-deck-backend.jar --spring.profiles.active=cloud

server:
  # Sin esto, el proxy aparece como cliente y la exencion de clave por
  # loopback dejaria crear partidas a cualquiera.
  forward-headers-strategy: framework

cyberdeck:
  security:
    allow-loopback-without-key: false
    jwt-secret: ${CYBERDECK_JWT_SECRET}
    instructor-key: ${CYBERDECK_INSTRUCTOR_KEY}
