server:
  port: ${PORT:8080}
  # Cerrar sin cortar las rondas que se estan resolviendo.
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    # Contra conexiones que se abren y no terminan de hablar (slowloris).
    connection-timeout: 5s
    keep-alive-timeout: 30s
    max-connections: ${HACKDECK_MAX_CONNECTIONS:2000}
    max-swallow-size: 256KB
    max-http-form-post-size: 256KB

spring:
  application:
    name: hack-deck-backend

hackdeck:
  security:
    # Vacia en local: se genera una clave aleatoria al arrancar y los tokens
    # caducan al reiniciar. En un servidor propio, fijala por entorno.
    jwt-secret: ${HACKDECK_JWT_SECRET:}
    token-ttl: 8h
    # Necesaria para crear partidas desde fuera del propio servidor.
    instructor-key: ${HACKDECK_INSTRUCTOR_KEY:}
    # Ponlo a false si hay un proxy inverso delante: el proxy se ve como
    # cliente local y todo el mundo quedaria exento de la clave.
    allow-loopback-without-key: ${HACKDECK_ALLOW_LOOPBACK:true}
    cors-allowed-origins: ${HACKDECK_CORS_ORIGINS:http://localhost:5173}
  public-url: ${HACKDECK_PUBLIC_URL:}
  # Cupos de un despliegue publico. En el aula no se rozan; estan para que
  # una sola IP no pueda llenar la memoria ni probar codigos a ciegas.
  limits:
    max-live-games: ${HACKDECK_MAX_LIVE_GAMES:500}
    max-live-tournaments: ${HACKDECK_MAX_LIVE_TOURNAMENTS:100}
    lobby-ttl: ${HACKDECK_LOBBY_TTL:30m}
    idle-ttl: ${HACKDECK_IDLE_TTL:2h}
    finished-ttl: ${HACKDECK_FINISHED_TTL:2h}
    purge-interval: 1m
    join-attempts-per-ip: ${HACKDECK_JOIN_ATTEMPTS:60}
    create-attempts-per-ip: ${HACKDECK_CREATE_ATTEMPTS:10}
    rate-limit-window: 1m
    # Ni Tomcat ni Spring topan el JSON por su cuenta. La peticion mas gorda
    # que existe es reordenar la cola, unos pocos kilobytes.
    max-request-body: ${HACKDECK_MAX_REQUEST_BODY:32KB}

