server:
  port: ${PORT:8080}

spring:
  application:
    name: hack-deck-backend

hackdeck:
  security:
    # Vacia en local: se genera una clave aleatoria al arrancar y los tokens
    # caducan al reiniciar. En un servidor propio, fijala por entorno.
    jwt-secret: ${HACKDECK_JWT_SECRET:}
    token-ttl: 8h
    # Necesaria para crear partidas desde fuera del propio servidor.
    instructor-key: ${HACKDECK_INSTRUCTOR_KEY:}
    # Ponlo a false si hay un proxy inverso delante: el proxy se ve como
    # cliente local y todo el mundo quedaria exento de la clave.
    allow-loopback-without-key: ${HACKDECK_ALLOW_LOOPBACK:true}
    cors-allowed-origins: ${HACKDECK_CORS_ORIGINS:http://localhost:5173}
  public-url: ${HACKDECK_PUBLIC_URL:}

